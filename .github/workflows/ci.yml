name: FlightPool CI

on:
  push:
    branches: [ main, "release-*" ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Drift Check, Contract Test, Unit Test, E2E & Production Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flightpool
          POSTGRES_PASSWORD: flightpool_test_pass
          POSTGRES_DB: flightpool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flightpool -d flightpool"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://flightpool:flightpool_test_pass@127.0.0.1:5432/flightpool?schema=public"
      SESSION_SECRET: "test_jwt_session_secret_min_32_characters_2026_ci"
      CRON_SECRET: "flightpool_ci_cron_secret_token_2026"
      PORT: 3000
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      DEMO_MODE: "true"
      NEXT_PUBLIC_DEMO_MODE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Schema Drift (Zero Drift)
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "postgresql://flightpool:flightpool_test_pass@127.0.0.1:5432/flightpool_shadow?schema=public" --exit-code

      - name: ESLint Code Quality Verification
        run: npm run lint

      - name: TypeScript Static Typecheck
        run: npx tsc --noEmit

      - name: Apply Database Migrations
        run: npx prisma migrate deploy

      - name: Seed Reference & Demo Data
        run: npm run db:seed:demo

      - name: Run Database Contract Test
        run: npx vitest run tests/db-contract.test.ts

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Production Application Build
        run: npm run build

      - name: Run Playwright End-to-End Suite
        run: npm run test:e2e

      - name: Run Smoke Suite
        run: npm run test:smoke
