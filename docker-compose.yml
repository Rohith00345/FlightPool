services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: flightpool-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flightpool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flightpool_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-flightpool}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flightpool} -d ${POSTGRES_DB:-flightpool}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: flightpool_postgres_data
